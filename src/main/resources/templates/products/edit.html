<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 수정 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .card { border-radius: 12px; }

        footer { font-size: .90rem; color: gray }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
    </div>
</nav>

<div class="container" style="max-width: 600px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-4 text-dark">상품 정보 수정</h4>

            <form th:action="@{/products/{id}/edit(id=${product.id})}" th:object="${product}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">상품명</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">설명</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">가격 (원)</label>
                    <input type="number" th:field="*{price}" class="form-control" required min="0">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">재고 수량</label>
                    <input type="number" th:field="*{stock}" class="form-control" required min="0">
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary w-100 fw-semibold" style="background-color: #0f3460; border: none;">수정 완료</button>
                    <a th:href="@{/products}" class="btn btn-secondary w-100">취소</a>
                </div>
            </form>
        </div>
    </div>

    <hr class="mt-5">
    <footer>
        <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss') + ' | 학번: 2371433 | 이름: 박나현'}"></p>
    </footer>
</div>

</body>
</html>
